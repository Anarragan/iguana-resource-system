openapi: 3.0.3
info:
  title: Caracterización La Iguaná – API de voluntarios
  version: 3.0.0
  description: |
    La API solo recolecta: escribe datos y devuelve avance, faltantes y alertas. No existe ningún endpoint que devuelva
    nombres, direcciones, teléfonos ni respuestas de una familia (eso se consulta en la base de datos).
    Autenticación: token de sesión de Supabase Auth en `Authorization: Bearer`. Reglas y ejemplos: contrato-api.md.
servers:
  - url: https://iguana-resource-system-production.up.railway.app
security:
  - bearerAuth: []
paths:
  /salud:
    get:
      summary: Chequeo de salud (público)
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { estado: { type: string, example: ok } } } } } }
  /catalogos:
    get:
      summary: Opciones y etiquetas de todas las preguntas
      description: Cada lista es `[{codigo, etiqueta}]`, salvo `gruposIntegrantes` y `categoriasDano` (`{campo, etiqueta}`) y `gruposNecesidad` (`{codigo, etiqueta, items[]}`).
      responses:
        '200': { description: Catálogos, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
  /hogares:
    get:
      summary: Avance de MIS hogares
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/Estado' } }
        - { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: desde, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Lista, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ResumenHogar' } } } } }
        '401': { $ref: '#/components/responses/NoAutenticado' }
    post:
      summary: Momento cero – consentimiento y contacto
      description: Si `autorizaTratamiento` es false no se aceptan datos personales y el asistente termina (`estado = sin_autorizacion`).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CrearHogar' } } } }
      responses:
        '201': { description: Hogar creado, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '409': { description: Ya existe un hogar con esa dirección, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hogares/{ref}/progreso:
    get:
      summary: Pasos hechos, qué falta y alertas
      parameters: [{ $ref: '#/components/parameters/ref' }]
      responses:
        '200': { description: Avance, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '404': { $ref: '#/components/responses/NoExiste' }
  /hogares/{ref}/contacto:
    put:
      summary: Corregir datos de contacto (la API los escribe pero no puede leerlos)
      parameters: [{ $ref: '#/components/parameters/ref' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Contacto' } } } }
      responses:
        '200': { description: Paso guardado; devuelve el avance actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoExiste' }
        '409': { description: El hogar ya no es editable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hogares/{ref}/composicion:
    put:
      summary: Módulo 1 – quién responde, cuántas personas, escolaridad (reemplaza el paso completo)
      parameters: [{ $ref: '#/components/parameters/ref' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Composicion' } } } }
      responses:
        '200': { description: Paso guardado; devuelve el avance actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoExiste' }
        '409': { description: El hogar ya no es editable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hogares/{ref}/vivienda:
    put:
      summary: Módulo 2 – vivienda y daños 0-4 (reemplaza el paso completo)
      parameters: [{ $ref: '#/components/parameters/ref' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Vivienda' } } } }
      responses:
        '200': { description: Paso guardado; devuelve el avance actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoExiste' }
        '409': { description: El hogar ya no es editable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hogares/{ref}/necesidades:
    put:
      summary: Módulo 3 – qué necesitan y lo más urgente (reemplaza el paso completo)
      parameters: [{ $ref: '#/components/parameters/ref' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Necesidades' } } } }
      responses:
        '200': { description: Paso guardado; devuelve el avance actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoExiste' }
        '409': { description: El hogar ya no es editable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hogares/{ref}/atencion:
    put:
      summary: Módulo 4 – quién ha pasado y qué dicen haber recibido (reemplaza el paso completo)
      parameters: [{ $ref: '#/components/parameters/ref' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Atencion' } } } }
      responses:
        '200': { description: Paso guardado; devuelve el avance actualizado, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '401': { $ref: '#/components/responses/NoAutenticado' }
        '404': { $ref: '#/components/responses/NoExiste' }
        '409': { description: El hogar ya no es editable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /hogares/{ref}/completar:
    post:
      summary: Cierra la ficha; si falta algo responde 400 con la lista
      parameters: [{ $ref: '#/components/parameters/ref' }]
      responses:
        '200': { description: Ficha completa, content: { application/json: { schema: { $ref: '#/components/schemas/Avance' } } } }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NoExiste' }
        '409': { description: Ya no es editable, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, description: access_token de Supabase Auth (supabase.auth.getSession()) }
  parameters:
    ref: { name: ref, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    NoAutenticado: { description: Sin sesión, sesión vencida o correo sin confirmar, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NoExiste: { description: El hogar no existe o no es tuyo, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Invalido: { description: Forma inválida, regla de coherencia o falta algo para completar, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message: { description: Texto o lista de textos; muéstralo siempre como lista, oneOf: [{ type: string }, { type: array, items: { type: string } }] }
    Estado: { type: string, enum: [borrador, completo, sin_autorizacion] }
    Triestado: { type: string, enum: [si, no, no_sabe] }
    Pasos:
      type: object
      properties:
        contacto: { type: boolean }
        composicion: { type: boolean }
        vivienda: { type: boolean }
        necesidades: { type: boolean }
        atencion: { type: boolean }
    ResumenHogar:
      type: object
      properties:
        ref: { type: string, format: uuid }
        codigo: { type: string, example: IG-0002 }
        estado: { $ref: '#/components/schemas/Estado' }
        sector: { type: string, nullable: true }
        fechaAplicacion: { type: string, format: date }
        aplicadaPor: { type: string, description: Correo del voluntario }
        actualizadoEn: { type: string, format: date-time }
        pasos: { $ref: '#/components/schemas/Pasos' }
        requiereSeguimiento: { type: boolean }
    Avance:
      allOf:
        - $ref: '#/components/schemas/ResumenHogar'
        - type: object
          properties:
            faltantes: { type: array, items: { type: string }, description: Frases listas para mostrar }
            puedeCompletar: { type: boolean }
            resumen:
              type: object
              properties:
                numPersonas: { type: integer, nullable: true }
                ninos: { type: integer, nullable: true }
                adultosMayores: { type: integer, nullable: true }
                totalDano: { type: integer, nullable: true }
            alertas:
              type: object
              properties:
                duermeEnRiesgo: { type: boolean }
                urgenteSalud: { type: boolean }
                urgenteAguaAlimento: { type: boolean }
                electricaRiesgo: { type: boolean }
    CrearHogar:
      type: object
      required: [autorizaTratamiento, versionConsentimiento]
      additionalProperties: false
      properties:
        fechaAplicacion: { type: string, format: date, description: Opcional, hoy por defecto; no futura }
        autorizaTratamiento: { type: boolean }
        autorizaSeguimiento: { type: boolean, description: Solo true si autorizaTratamiento es true }
        versionConsentimiento: { type: string, maxLength: 20, example: v1 }
        sector: { type: string, maxLength: 100 }
        direccion: { type: string, maxLength: 200, description: Obligatoria si autoriza; prohibida si no }
        interior: { type: string, maxLength: 50 }
        callejon: { type: string, maxLength: 100 }
        nombreReferencia: { type: string, maxLength: 150, description: Obligatorio si autoriza; prohibido si no }
        telefonoContacto: { type: string, pattern: '^[0-9+() -]{7,30}$' }
        observaciones: { type: string, maxLength: 1000 }
    Contacto:
      type: object
      required: [direccion, nombreReferencia]
      additionalProperties: false
      properties:
        direccion: { type: string, maxLength: 200 }
        interior: { type: string, maxLength: 50 }
        callejon: { type: string, maxLength: 100 }
        nombreReferencia: { type: string, maxLength: 150 }
        telefonoContacto: { type: string, pattern: '^[0-9+() -]{7,30}$' }
        observaciones: { type: string, maxLength: 1000 }
    Composicion:
      type: object
      additionalProperties: false
      description: Obligatorios para completar respEsJefe y numPersonas. Ni niños + adultosMayores ni ningún grupo pueden superar numPersonas.
      properties:
        respEsJefe: { type: boolean }
        respParentesco: { type: string, maxLength: 60, description: Solo si respEsJefe es false }
        respGenero: { type: string, enum: [femenino, masculino, no_binario_otro, prefiere_no_responder] }
        respEdad: { type: integer, minimum: 0, maximum: 120 }
        numPersonas: { type: integer, minimum: 1, maximum: 60 }
        ninosEdades: { type: array, maxItems: 60, items: { type: integer, minimum: 0, maximum: 17 }, description: 'Edad de cada niño/a; [] si no hay' }
        adultosMayores: { type: integer, minimum: 0, maximum: 60 }
        conDiscapacidad: { type: integer, minimum: 0, maximum: 60 }
        embarazoLactancia: { type: integer, minimum: 0, maximum: 60 }
        cuidadosEspeciales: { type: integer, minimum: 0, maximum: 60 }
        cuidadores: { type: integer, minimum: 0, maximum: 60 }
        sostenimiento: { type: integer, minimum: 0, maximum: 60 }
        escolarEstado: { type: string, enum: [siguen_asistiendo, dejaron_de_asistir], description: Solo si hay niños }
        escolarDias: { type: integer, minimum: 0, maximum: 32767, description: Solo si dejaron_de_asistir }
        escolarManejo: { type: string, enum: [normalidad, con_dificultades, no_estudia, otro] }
        escolarManejoOtro: { type: string, maxLength: 150, description: Solo si escolarManejo es otro }
    Vivienda:
      type: object
      additionalProperties: false
      description: Obligatorios para completar pernocta y los 8 daños (0 sin daño, 1 leve, 2 moderado, 3 severo, 4 pérdida total).
      properties:
        materialParedes: { type: string, enum: [concreto_ladrillo, madera_tablaroca, bahareque_adobe, zinc_carton_madera_no_tratada, reciclado_desecho] }
        nivelAgua: { type: string, enum: [no_entro, tobillo, rodilla, cintura, pecho, techo] }
        inundadaAntes: { $ref: '#/components/schemas/Triestado' }
        medioAlerta: { type: string, enum: [alerta_oficial, vecinos, sirena, no_se_entero, otro] }
        medioAlertaOtro: { type: string, maxLength: 150, description: Solo si medioAlerta es otro }
        pernocta: { type: string, enum: [misma_vivienda, familiares_amistades, albergue, arrendado_temporal, intemperie_improvisado, sin_lugar] }
        ingresos: { type: string, enum: [interrumpida_total, reducida_temporal, no_afectada, otro] }
        ingresosOtro: { type: string, maxLength: 150, description: Solo si ingresos es otro }
        electricaDanada: { type: boolean }
        lodo: { type: string, enum: [nada, poco, mucho] }
        acceso: { type: string, enum: [despejado, con_escombros, bloqueado] }
        viviendaVista: { type: boolean }
        danoEstructura: { $ref: '#/components/schemas/Dano' }
        danoTechoPuertasVentanas: { $ref: '#/components/schemas/Dano' }
        danoInstalaciones: { $ref: '#/components/schemas/Dano' }
        danoMueblesElectrodomesticos: { $ref: '#/components/schemas/Dano' }
        danoRopaEnseres: { $ref: '#/components/schemas/Dano' }
        danoHerramientasTrabajo: { $ref: '#/components/schemas/Dano' }
        danoDocumentos: { $ref: '#/components/schemas/Dano' }
        danoAnimales: { $ref: '#/components/schemas/Dano' }
    Dano: { type: integer, minimum: 0, maximum: 4 }
    ItemNecesidad:
      type: string
      enum: [alimentos, agua_beber, alimento_mascotas, articulos_aseo_personal, higiene_menstrual_reproductiva, productos_limpieza,
             ayuda_limpiar_lodo_escombros, colchones_camas, ropa_calzado, electrodomesticos, materiales_reparacion,
             herramientas_insumos_negocio, medicamentos_atencion_medica, utiles_escolares_ninos, otro_condicion_especial]
    Necesidades:
      type: object
      additionalProperties: false
      properties:
        items: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/ItemNecesidad' } }
        urgentes: { type: array, uniqueItems: true, maxItems: 3, items: { $ref: '#/components/schemas/ItemNecesidad' }, description: Entre los marcados; el orden es la prioridad 1-2-3 }
        detalleOtro: { type: string, maxLength: 1000, description: Obligatorio si items incluye otro_condicion_especial; prohibido si no }
        apoyoEmocional: { type: boolean }
        numMascotas: { type: integer, minimum: 0, maximum: 32767 }
    Atencion:
      type: object
      additionalProperties: false
      properties:
        visitas: { type: array, uniqueItems: true, items: { type: string, enum: [alcaldia_dagrd, jac, cruz_roja_defensa_civil_bomberos, organizacion_voluntarios, otro, nadie] }, description: '`nadie` va solo' }
        visitasOtro: { type: string, maxLength: 150, description: Solo si visitas incluye otro }
        censoPrevio: { $ref: '#/components/schemas/Triestado' }
        censoQuien: { type: string, maxLength: 150, description: Solo si censoPrevio es si }
        dictamen: { type: string, enum: [puede_habitarse, evacuacion_temporal, evacuacion_definitiva, nadie_ha_ido] }
        inscritaRud: { $ref: '#/components/schemas/Triestado' }
        ofertaRecibida: { type: boolean }
        ofertaAceptada: { type: boolean, description: Solo si ofertaRecibida es true }
        ayudasRecibidas: { type: array, uniqueItems: true, items: { type: string, enum: [kit_aseo, alimentos, colchoneta, agua, otra, ninguna] }, description: '`ninguna` va sola' }
        ayudasOtra: { type: string, maxLength: 150, description: Solo si ayudasRecibidas incluye otra }
